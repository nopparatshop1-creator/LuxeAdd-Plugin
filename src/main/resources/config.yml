      - "&8==========================================="
      - "&e[LuxeAdd] &fต้องการดาวน์โหลด Resource Pack ของเซิร์ฟเวอร์หรือไม่?"
      - "&fคลิกที่นี่เพื่อดาวน์โหลด: &n&a[คลิกเพื่อดาวน์โหลด Resource Pack]"
      - "&8==========================================="

