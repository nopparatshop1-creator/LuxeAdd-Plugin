# LuxeAdd Configuration File
gui:
  title: "&5LuxeAdd - Custom Items"

# ระบบบังคับดาวน์โหลด Resource Pack อัตโนมัติ
resource-pack:
  enabled: true
  # ลิงก์ตรงสำหรับดาวน์โหลดไฟล์ .zip (ต้องเป็น Direct Link)
  url: "https://example.com/your-resource-pack.zip"
  # ข้อความแจ้งเตือนที่ขึ้นบนหน้าจอผู้เล่น
  prompt-message: "&eโปรดดาวน์โหลด Resource Pack เพื่อเข้าใช้งานเซิร์ฟเวอร์!"
  # บังคับโหลด (true = ถ้าปฏิเสธจะโดนเตะออกจากเซิร์ฟเวอร์)
  force: true
  # ข้อความที่จะขึ้นเตือนเมื่อผู้เล่นกดปฏิเสธ
  kick-message: "&cคุณต้องกด ยอมรับ (Accept) Resource Pack เพื่อเข้าเล่นในเซิร์ฟเวอร์นี้!"

items:
  sword_3d:
    slot: 13
    material: PAPER
    model-data: 10001
    display-name: "&6Sword 3D Model"
    lore:
      - "&7Click to get this 3D Item"
