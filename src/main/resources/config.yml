# LuxeAdd Configuration File
gui:
  title: "&5LuxeAdd - Custom Items"

# ระบบ Resource Pack อัตโนมัติและกล่องข้อความสอบถาม
resource-pack:
  enabled: true
  url: "https://example.com/your-resource-pack.zip"
  
  # ข้อความที่จะขึ้นในป๊อปอัพคำถามมาตรฐานของ Minecraft
  prompt-message: "&eเซิร์ฟเวอร์ต้องการให้คุณดาวน์โหลด Resource Pack โมเดล 3D\n&fคุณต้องการดาวน์โหลดเลยหรือไม่?"
  
  # บังคับหรือไม่ (false = ให้ผู้เล่นปฏิเสธได้โดยไม่ถูกเตะออกจากเซิร์ฟเวอร์)
  force: false
  kick-message: "&cคุณต้องกด ยอมรับ (Accept) Resource Pack เพื่อเข้าเล่นในเซิร์ฟเวอร์นี้!"

  # ระบบส่งข้อความต้อนรับถามผู้เล่นในแชท
  welcome-message:
    enabled: true
    title: "&a&lRESOURCE PACK"
